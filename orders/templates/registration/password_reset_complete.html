{% extends "orders/base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block body_class %}bg-cream{% endblock %}

{% block body %}
<div class="flex justify-center" style="margin-top: 3rem;">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-artisan shadow-warm p-8 text-center">
            <h1 class="font-display text-3xl font-bold text-charcoal mb-3">Seed &amp; Sprout</h1>
            <h2 class="font-display text-xl text-charcoal mb-3">Password Reset Complete</h2>
            <p class="text-charcoal-light/70 text-sm mb-5">Your password has been set. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="inline-block bg-terracotta hover:bg-terracotta-dark text-white font-semibold py-2.5 px-6 rounded-artisan transition-all hover:-translate-y-0.5">Login</a>
        </div>
    </div>
</div>
{% endblock %}
