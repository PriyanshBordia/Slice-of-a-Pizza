{% extends "orders/base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block body_class %}auth-page{% endblock %}

{% block body %}
<div class="row justify-content-center" style="margin-top: 4rem;">
    <div class="col-12">
        <div class="auth-card text-center">
            <div class="auth-brand mb-3">Slice of a Pizza</div>
            <h4 style="color: var(--dark); margin-bottom: 1rem;">Password Reset Complete</h4>
            <p style="color: var(--warm-gray);">Your password has been set. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="btn btn-brand" style="margin-top: 1rem;">Login</a>
        </div>
    </div>
</div>
{% endblock %}
