{% extends "orders/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block body_class %}bg-cream{% endblock %}

{% block body %}
<div class="flex justify-center" style="margin-top: 3rem;">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-artisan shadow-warm p-8">
            <div class="text-center mb-6">
                <h1 class="font-display text-3xl font-bold text-charcoal">Seed &amp; Sprout</h1>
                <p class="text-charcoal-light/60 text-sm mt-1">Enter your email to reset your password</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-5">
                    <label for="email" class="block text-sm font-medium text-charcoal-light mb-1">Email</label>
                    <input type="email" class="w-full px-4 py-3 border border-cream-dark rounded-artisan text-charcoal bg-parchment focus:border-terracotta focus:ring-2 focus:ring-terracotta/20 transition" id="email" name="email" required>
                </div>
                <button type="submit" class="w-full bg-terracotta hover:bg-terracotta-dark text-white font-semibold py-3 rounded-artisan transition-all hover:-translate-y-0.5 hover:shadow-warm">Send Reset Link</button>
            </form>
            <div class="text-center mt-5">
                <p class="text-sm"><a href="{% url 'login' %}" class="text-charcoal-light/50 hover:text-charcoal-light transition-colors">Back to Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
